name: Hotspot collect

# UTC 调度。北京时间 = UTC+8，下列 7 次对应北京 08:17 / 10:17 / 12:17 /
# 14:17 / 16:17 / 18:17 / 20:17，每两小时一次。避开整点可降低 GitHub 高负载时的延迟或丢弃。
# 末批必须是北京 20:17：日报在 20:43 生成，若末批排到 21:17 就会晚于日报，
# 导致当天最后一轮数据永远进不了当天的日报（曾被这个问题漏掉一整批）。
on:
  schedule:
    - cron: '17 0,2,4,6,8,10,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 采集与周报共用同一组，避免两个 workflow 同时 push 产生冲突
concurrency:
  group: hotspot-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect hot lists
        run: python cloud.py collect

      - name: Commit data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "hotspot-bot"
          git config user.email "hotspot-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
          # checkout 默认是 detached HEAD，必须显式给 refspec，否则 push 会立即失败
          git push origin HEAD:"${{ github.ref_name }}"
