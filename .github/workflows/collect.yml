name: Hotspot collect

# UTC 调度。北京时间 = UTC+8，下列 7 次对应北京 09:17 / 11:17 / 13:17 /
# 15:17 / 19:17 等两小时一次。避开整点可降低 GitHub 高负载时的延迟或丢弃。
on:
  schedule:
    - cron: '17 1,3,5,7,9,11,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 采集与周报共用同一组，避免两个 workflow 同时 push 产生冲突
concurrency:
  group: hotspot-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect hot lists
        run: python cloud.py collect

      - name: Commit data
        run: |
          git config user.name "hotspot-bot"
          git config user.email "hotspot-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
