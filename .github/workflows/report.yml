name: Hotspot daily report

# UTC 每天 12:43 = 北京时间每天 20:43
# 采集末批在北京 20:17（见 collect.yml），日报 20:43 能收全当天 7 轮数据。
# 与 Weekly digest（周五 20:47）共用同一 concurrency 组串行执行。
# 避开整点：GitHub Actions 整点排队最容易延迟甚至丢弃。
on:
  schedule:
    - cron: '43 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotspot-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build daily report
        run: python cloud.py report

      - name: Commit report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "hotspot-bot"
          git config user.email "hotspot-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add docs/
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "report: day $(date -u +%Y-%m-%d)"
          git push origin HEAD:"${{ github.ref_name }}"
