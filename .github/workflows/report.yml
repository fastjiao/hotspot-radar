name: Hotspot weekly report

# UTC 周五 12:43 = 北京时间周五 20:43
# cron 星期位：0/7=周日，5=周五
on:
  schedule:
    - cron: '43 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotspot-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build weekly report
        run: python cloud.py report

      - name: Commit report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "hotspot-bot"
          git config user.email "hotspot-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add docs/
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "report: week $(date -u +%Y-%m-%d)"
          git push origin HEAD:"${{ github.ref_name }}"
